services:
 postgres:
  image: postgres:16-alpine
  environment: {POSTGRES_USER: forge, POSTGRES_PASSWORD: forge, POSTGRES_DB: forgeapk}
  ports: ["5432:5432"]
  volumes: [pgdata:/var/lib/postgresql/data]
 redis:
  image: redis:7-alpine
  ports: ["6379:6379"]
 worker:
  build: ./worker
  environment: {WORKER_TOKEN: change-me, ARTIFACT_DIR: /artifacts}
  ports: ["8787:8787"]
  volumes: [artifacts:/artifacts]
volumes: {pgdata: {}, artifacts: {}}